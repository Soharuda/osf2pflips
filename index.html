<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS F2P Market Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; }
        h1 { color: #4CAF50; text-align: center; font-size: 1.3rem; margin-bottom: 10px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { background: #1e1e1e; color: #aaa; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: #4CAF50; color: #fff; border-color: #4CAF50; }
        
        .parent-sub-tabs { display: none; gap: 5px; margin-bottom: 6px; overflow-x: auto; padding-bottom: 4px; }
        .parent-sub-btn { background: #1e1e1e; color: #ccc; border: 1px solid #555; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
        .parent-sub-btn.active { background: #FF9800; color: #fff; border-color: #FF9800; }

        .child-sub-tabs { display: none; gap: 4px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
        .child-sub-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; white-space: nowrap; display: flex; align-items: center; gap: 4px; font-weight: bold; }
        .child-sub-btn img { width: 18px; height: 18px; object-fit: contain; }
        .child-sub-btn.active { background: #2196F3; color: #fff; border-color: #2196F3; }

        details { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; padding: 10px; }
        summary { font-size: 1.0rem; font-weight: bold; color: #FF9800; cursor: pointer; outline: none; }
        .card { background: #252525; border-radius: 6px; padding: 8px; margin-top: 8px; display: flex; align-items: center; cursor: pointer; border: 1px solid #444; }
        .card img { width: 30px; height: 30px; object-fit: contain; margin-right: 10px; }
        .card-info { flex-grow: 1; font-size: 0.8rem; }
        .card-title { font-weight: bold; color: #fff; }
        .controls { display: flex; gap: 8px; margin-bottom: 8px; }
        input { width: 100%; padding: 9px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.85rem; box-sizing: border-box; }
        
        .table-container { 
            max-height: calc(100vh - 250px); 
            overflow-y: auto; 
            border: 1px solid #333; 
            border-radius: 6px; 
            background: #1e1e1e; 
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: #1e1e1e; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2c2c2c; color: #ffa726; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 10; }
        th:hover { background: #3c3c3c; }
        tr { cursor: pointer; }
        tr:hover { background: #2a2a2a; }
        
        .highlight { color: #00E676; font-weight: bold; }
        .neg-highlight { color: #FF5252; font-weight: bold; }
        .alch-highlight { color: #29b6f6; font-weight: bold; }
        .tax-text { color: #ffab40; }
        .ing-text { font-size: 0.7rem; color: #aaa; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); overflow-y: auto; padding: 10px; box-sizing: border-box; }
        .modal-content { background-color: #1e1e1e; margin: 3% auto; padding: 15px; border-radius: 10px; width: 100%; max-width: 600px; color: #fff; position: relative; text-align: center; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #fff; }
        
        .modal-header { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
        .modal-header h3 { margin: 0; color: #4CAF50; font-size: 1.2rem; }
        .modal-header img { width: 42px; height: 42px; object-fit: contain; margin-top: 4px; }

        .modal-stats-table { width: 100%; border-collapse: collapse; background: #161616; border-radius: 6px; overflow: hidden; margin-bottom: 12px; font-size: 0.8rem; }
        .modal-stats-table th, .modal-stats-table td { padding: 6px 10px; border: 1px solid #333; text-align: center; }
        .modal-stats-table th { background: #222; color: #ffa726; font-size: 0.75rem; }

        .btn-group { display: flex; gap: 4px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-group button { background: #2c2c2c; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-group button.active { background: #4CAF50; border-color: #4CAF50; }
        .chart-container { position: relative; margin-bottom: 15px; height: 180px; width: 100%; }
    </style>
</head>
<body>
    <h1>🪙 OSRS F2P Market Dashboard</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="setCategory('home', this)">Home</button>
        <button class="tab-btn" onclick="setCategory('flips', this)">All Items</button>
        <button class="tab-btn" onclick="setCategory('alch', this)">High Alch Hub</button>
        <button class="tab-btn" onclick="setCategory('crafting', this)">Crafting & Recipes</button>
    </div>

    <div class="parent-sub-tabs" id="parentSubTabs">
        <button class="parent-sub-btn active" onclick="setParentSkill('smithing', this)">Smithing</button>
        <button class="parent-sub-btn" onclick="setParentSkill('crafting', this)">Crafting</button>
        <button class="parent-sub-btn" onclick="setParentSkill('cooking', this)">Cooking</button>
    </div>

    <div class="child-sub-tabs" id="smithingSubTabs">
        <button class="child-sub-btn active" onclick="setSubFilter('all', this)">All Metals</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_bronze', this)"><img src="https://oldschool.runescape.wiki/images/Bronze_bar.png"> Bronze</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_iron', this)"><img src="https://oldschool.runescape.wiki/images/Iron_bar.png"> Iron</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_steel', this)"><img src="https://oldschool.runescape.wiki/images/Steel_bar.png"> Steel</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_mithril', this)"><img src="https://oldschool.runescape.wiki/images/Mithril_bar.png"> Mithril</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_adamant', this)"><img src="https://oldschool.runescape.wiki/images/Adamantite_bar.png"> Adamant</button>
        <button class="child-sub-btn" onclick="setSubFilter('smithing_runite', this)"><img src="https://oldschool.runescape.wiki/images/Runite_bar.png"> Runite</button>
    </div>

    <div class="child-sub-tabs" id="craftingSubTabs">
        <button class="child-sub-btn active" onclick="setSubFilter('all', this)">All Crafting</button>
        <button class="child-sub-btn" onclick="setSubFilter('crafting_jewelry', this)"><img src="https://oldschool.runescape.wiki/images/Gold_ring.png"> Jewelry & Gems</button>
        <button class="child-sub-btn" onclick="setSubFilter('crafting_leather', this)"><img src="https://oldschool.runescape.wiki/images/Leather_body.png"> Leather</button>
    </div>

    <div id="homeSectionsContainer">
        <details open>
            <summary>⚡ Top 20 Recommended Flips</summary>
            <div id="recContainer" style="margin-top: 10px;">Loading live data...</div>
        </details>
        <details>
            <summary>🌙 Top 20 Recommended Overnight Flips (High Volume)</summary>
            <div id="overnightContainer" style="margin-top: 10px;">Loading live data...</div>
        </details>
    </div>

    <div id="searchAndTableWrapper" style="display: none;">
        <div class="controls">
            <input type="text" id="searchInput" onkeyup="filterAndSortTable()" placeholder="Search item...">
        </div>
        <div id="paginationControls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem;">
            <button onclick="changePage(-1)" style="background:#2c2c2c; color:#fff; border:1px solid #444; padding:5px 12px; border-radius:4px; cursor:pointer;">Previous</button>
            <span id="pageIndicator" style="color:#aaa; font-weight:bold;">Page 1 of 1</span>
            <button onclick="changePage(1)" style="background:#2c2c2c; color:#fff; border:1px solid #444; padding:5px 12px; border-radius:4px; cursor:pointer;">Next</button>
        </div>

        <div class="table-container">
            <table id="itemTable">
                <thead>
                    <tr id="tableHeaders"></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="chartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeGraph()">&times;</span>
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <img id="modalIcon" src="" alt="" onerror="this.onerror=null; this.src='https://oldschool.runescape.wiki/images/Placeholder.png';">
            </div>

            <table class="modal-stats-table">
                <thead>
                    <tr>
                        <th>Current Buy (Low)</th>
                        <th>Current Sell (High)</th>
                        <th>GE Tax</th>
                        <th>Margin / Profit</th>
                        <th>Buy Limit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="modalBuy">0</td>
                        <td id="modalSell">0</td>
                        <td id="modalTax" class="tax-text">0</td>
                        <td id="modalMargin">0</td>
                        <td id="modalLimit">0</td>
                    </tr>
                </tbody>
            </table>

            <div class="btn-group">
                <button onclick="setTimeframe('1h')" id="btn-1h">1H</button>
                <button onclick="setTimeframe('48h')" id="btn-48h" class="active">48H</button>
                <button onclick="setTimeframe('1w')" id="btn-1w">1W</button>
                <button onclick="setTimeframe('1m')" id="btn-1m">1M</button>
                <button onclick="setTimeframe('3m')" id="btn-3m">3M</button>
                <button onclick="setTimeframe('6m')" id="btn-6m">6M</button>
            </div>
            <p style="font-size:0.8rem; color:#aaa; margin:0 0 4px 0;">High / Low Price Trend</p>
            <div class="chart-container"><canvas id="priceChart"></canvas></div>
            <p style="font-size:0.8rem; color:#aaa; margin:8px 0 4px 0;">Trade Volume</p>
            <div class="chart-container"><canvas id="volumeChart"></canvas></div>
        </div>
    </div>

    <script>
        let allItems = [];
        let generalRecs = [];
        let overnightData = [];
        let recipeData = [];
        let itemHistories = {};

        let priceChartObj = null;
        let volumeChartObj = null;
        let currentItemId = null;
        let currentItemName = "";
        let currentCategory = "home";
        let currentParentSkill = "smithing";
        let currentSubFilter = "all";
        let sortField = "volume";
        let sortAsc = false;

        let currentPage = 1;
        const pageSize = 25;

        async function initDashboard() {
            try {
                let response = await fetch('/api/data');
                let data = await response.json();
                allItems = data.items;
                generalRecs = data.recommendations;
                overnightData = data.overnight;
                recipeData = data.recipes;

                populateCards('recContainer', generalRecs);
                populateCards('overnightContainer', overnightData);
            } catch (err) {
                console.error("Failed to load live SQLite data:", err);
            }
        }

        function populateCards(containerId, data) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            data.forEach((item, idx) => {
                let div = document.createElement('div');
                div.className = "card";
                div.onclick = () => openGraph(item);
                div.innerHTML = `
                    <img src="${item.icon}" loading="lazy" onerror="this.src='https://oldschool.runescape.wiki/images/Placeholder.png'">
                    <div class="card-info">
                        <div class="card-title">${idx + 1}. ${item.name}</div>
                        <div>Buy: ${item.buy.toLocaleString()} | Sell: ${item.sell.toLocaleString()} | Limit: ${item.limit.toLocaleString()}</div>
                        <div>Profit: <span class="highlight">+${item.margin.toLocaleString()} gp</span> | Daily Vol: ${item.volume.toLocaleString()}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function setParentSkill(skill, btn) {
            currentParentSkill = skill;
            document.querySelectorAll('.parent-sub-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentSubFilter = "all";
            currentPage = 1;
            const smithingTabs = document.getElementById('smithingSubTabs');
            const craftingTabs = document.getElementById('craftingSubTabs');

            smithingTabs.style.display = "none";
            craftingTabs.style.display = "none";

            if (skill === 'smithing') {
                smithingTabs.style.display = "flex";
                smithingTabs.querySelector('.child-sub-btn').classList.add('active');
            } else if (skill === 'crafting') {
                craftingTabs.style.display = "flex";
                craftingTabs.querySelector('.child-sub-btn').classList.add('active');
            }
            filterAndSortTable();
        }

        function setSubFilter(filter, btn) {
            currentSubFilter = filter;
            currentPage = 1;
            let parentContainer = btn.parentElement;
            parentContainer.querySelectorAll('.child-sub-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndSortTable();
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            currentPage = 1;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const homeSections = document.getElementById('homeSectionsContainer');
            const tableWrapper = document.getElementById('searchAndTableWrapper');
            const parentSubTabs = document.getElementById('parentSubTabs');
            const smithingTabs = document.getElementById('smithingSubTabs');
            const craftingTabs = document.getElementById('craftingSubTabs');

            parentSubTabs.style.display = "none";
            smithingTabs.style.display = "none";
            craftingTabs.style.display = "none";

            if (cat === 'home') {
                homeSections.style.display = "block";
                tableWrapper.style.display = "none";
                populateCards('recContainer', generalRecs);
                populateCards('overnightContainer', overnightData);
            } else {
                homeSections.style.display = "none";
                tableWrapper.style.display = "block";

                if (cat === 'alch') {
                    sortField = "alch_profit";
                    sortAsc = false;
                    document.getElementById('tableHeaders').innerHTML = `
                        <th>Icon</th>
                        <th onclick="toggleSort('name')">Item ↕</th>
                        <th onclick="toggleSort('buy')">Buy Price ↕</th>
                        <th onclick="toggleSort('alch_value')">Alch Value ↕</th>
                        <th onclick="toggleSort('alch_profit')">Profit/Cast ↕</th>
                        <th onclick="toggleSort('limit')">Limit ↕</th>
                    `;
                } else if (cat === 'crafting') {
                    parentSubTabs.style.display = "flex";
                    if (currentParentSkill === 'smithing') smithingSubTabs.style.display = "flex";
                    if (currentParentSkill === 'crafting') craftingSubTabs.style.display = "flex";

                    sortField = "level";
                    sortAsc = false;

                    document.getElementById('tableHeaders').innerHTML = `
                        <th>Icon</th>
                        <th onclick="toggleSort('name')">Product ↕</th>
                        <th onclick="toggleSort('level')">Lvl ↕</th>
                        <th>Ingredients Required</th>
                        <th onclick="toggleSort('cost')">Craft Cost ↕</th>
                        <th onclick="toggleSort('sell')">Sell Price ↕</th>
                        <th onclick="toggleSort('profit')">GE Profit ↕</th>
                        <th onclick="toggleSort('alch_profit')">Alch Profit ↕</th>
                    `;
                } else {
                    sortField = "volume";
                    sortAsc = false;
                    document.getElementById('tableHeaders').innerHTML = `
                        <th>Icon</th>
                        <th onclick="toggleSort('name')">Item ↕</th>
                        <th onclick="toggleSort('buy')">Buy ↕</th>
                        <th onclick="toggleSort('sell')">Sell ↕</th>
                        <th onclick="toggleSort('tax')">Tax ↕</th>
                        <th onclick="toggleSort('margin')">Profit ↕</th>
                        <th onclick="toggleSort('volume')">Volume ↕</th>
                        <th onclick="toggleSort('limit')">Limit ↕</th>
                    `;
                }
                filterAndSortTable();
            }
        }

        function toggleSort(field) {
            if (sortField === field) {
                sortAsc = !sortAsc;
            } else {
                sortField = field;
                sortAsc = (field === 'name');
            }
            currentPage = 1;
            filterAndSortTable();
        }

        function changePage(direction) {
            currentPage += direction;
            filterAndSortTable();
            document.querySelector('.table-container').scrollTop = 0;
        }

        function getVolumeColor(vol) {
            if (vol <= 0) return '#FF5252';
            let logVol = Math.log10(vol + 1);
            let maxLog = Math.log10(1000000 + 1);
            let t = Math.min(logVol / maxLog, 1);
            
            let r, g, b;
            if (t < 0.5) {
                let subT = t * 2;
                r = 255;
                g = Math.round(82 + (235 - 82) * subT);
                b = Math.round(82 + (59 - 82) * subT);
            } else {
                let subT = (t - 0.5) * 2;
                r = Math.round(255 + (0 - 255) * subT);
                g = Math.round(235 + (230 - 235) * subT);
                b = Math.round(59 + (118 - 59) * subT);
            }
            return `rgb(${r}, ${g}, ${b})`;
        }

        // --- CORE FIX: Filter, Sort, and Slice Data for Pagination ---
        function filterAndSortTable() {
            let searchVal = document.getElementById('searchInput').value.toLowerCase();
            let dataset = (currentCategory === 'crafting') ? recipeData : allItems;

            // 1. Filter by Search Query & Sub-filters
            let filtered = dataset.filter(item => {
                let matchesSearch = item.name.toLowerCase().includes(searchVal);
                if (!matchesSearch) return false;

                if (currentCategory === 'crafting') {
                    if (currentSubFilter !== 'all' && item.category !== currentSubFilter) {
                        return false;
                    }
                }
                return true;
            });

            // 2. Sort Data
            filtered.sort((a, b => {
                let valA = a[sortField];
                let valB = b[sortField];

                if (typeof valA === 'string') {
                    return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return sortAsc ? valA - valB : valB - valA;
            }));

            // 3. Pagination Math & Boundary Checks
            let totalPages = Math.ceil(filtered.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;

            // 4. Slice only currently visible items
            let startIdx = (currentPage - 1) * pageSize;
            let paginatedItems = filtered.slice(startIdx, startIdx + pageSize);

            // 5. Render rows into tbody
            let tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            paginatedItems.forEach(item => {
                let tr = document.createElement('tr');
                tr.onclick = () => openGraph(item);

                if (currentCategory === 'alch') {
                    tr.innerHTML = `
                        <td><img src="${item.icon}" width="24" height="24" loading="lazy" onerror="this.src='https://oldschool.runescape.wiki/images/Placeholder.png'"></td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.buy.toLocaleString()}</td>
                        <td class="alch-highlight">${item.alch_value.toLocaleString()}</td>
                        <td class="${item.alch_profit >= 0 ? 'highlight' : 'neg-highlight'}">${item.alch_profit.toLocaleString()}</td>
                        <td>${item.limit.toLocaleString()}</td>
                    `;
                } else if (currentCategory === 'crafting') {
                    tr.innerHTML = `
                        <td><img src="${item.icon}" width="24" height="24" loading="lazy" onerror="this.src='https://oldschool.runescape.wiki/images/Placeholder.png'"></td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.level}</td>
                        <td class="ing-text">${item.ingredients}</td>
                        <td>${item.cost.toLocaleString()}</td>
                        <td>${item.sell.toLocaleString()}</td>
                        <td class="${item.profit >= 0 ? 'highlight' : 'neg-highlight'}">${item.profit.toLocaleString()}</td>
                        <td class="${item.alch_profit >= 0 ? 'alch-highlight' : 'neg-highlight'}">${item.alch_profit.toLocaleString()}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td><img src="${item.icon}" width="24" height="24" loading="lazy" onerror="this.src='https://oldschool.runescape.wiki/images/Placeholder.png'"></td>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.buy.toLocaleString()}</td>
                        <td>${item.sell.toLocaleString()}</td>
                        <td class="tax-text">${item.tax.toLocaleString()}</td>
                        <td class="highlight">+${item.margin.toLocaleString()}</td>
                        <td style="color: ${getVolumeColor(item.volume)};">${item.volume.toLocaleString()}</td>
                        <td>${item.limit.toLocaleString()}</td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        // Initialize dashboard on load
        window.onload = initDashboard;
    </script>
</body>
</html>
